name: nex_ledger
description: "NexLedger — Mini ERP for project-wise cash flow, purchases, labour, and deposits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Local database — drift + SQLite
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24

  # Navigation
  go_router: ^14.6.3

  # Utilities
  path_provider: ^2.1.5
  path: ^1.9.0
  file_picker: ^8.1.7
  intl: ^0.19.0
  excel: ^4.0.3
  crypto: ^3.0.3

  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8

  # Firebase Remote Config
  firebase_core: ^3.6.0
  firebase_remote_config: ^5.1.3
  window_manager: ^0.5.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
