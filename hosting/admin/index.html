<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NexLedger Admin</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --blue:#1f5fbf; --green:#059669; --red:#dc2626; --amber:#d97706; --soft:#f8fafc;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --card:#131c2e; --text:#e6edf7; --muted:#94a3b8; --line:#243049; --soft:#0f1829; --blue:#6aa0f0; --green:#34d399; --red:#f87171; --amber:#fbbf24; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:18px;margin:0}
  header .who{font-size:12px;color:var(--muted);text-align:right;word-break:break-all}
  main{max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 10px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=number],textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--text);font:inherit}
  textarea{min-height:64px;resize:vertical}
  button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:var(--blue);color:#fff;font-weight:600}
  button.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
  button.red{background:var(--red)} button.green{background:var(--green)} button.amber{background:var(--amber)}
  button.small{padding:6px 10px;font-size:13px}
  button:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:140px}
  .chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
  .chip.active{background:#05966922;color:var(--green)} .chip.blocked{background:#dc262622;color:var(--red)} .chip.maint{background:#d9770622;color:var(--amber)}
  .client{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}
  .client>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .client>summary::-webkit-details-marker{display:none}
  .client .name{font-weight:700}
  .client .meta{font-size:12px;color:var(--muted)}
  .client .body{padding:0 14px 14px;border-top:1px solid var(--line)}
  .key{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.5px}
  .warn{color:var(--red);font-size:12px;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
  .hidden{display:none!important}
  .center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
  .created{background:#05966914;border:1px solid #05966955;border-radius:12px;padding:12px;margin-top:12px}
  @media (max-width:520px){ main{padding:10px} .card{padding:12px} }
</style>
</head>
<body>
<header>
  <h1>NexLedger Admin</h1>
  <div class="who"><span id="who"></span> <button class="ghost small hidden" id="signOut">Sign out</button></div>
</header>

<div id="signedOut" class="center">
  <div>
    <p>Sign in with your admin Google account.</p>
    <button id="signIn">Sign in with Google</button>
    <p class="meta" id="authMsg" style="color:var(--red)"></p>
  </div>
</div>

<main id="app" class="hidden">
  <section class="card">
    <h2>Everyone</h2>
    <div class="row">
      <button id="gMaint" class="amber">Turn maintenance ON for all</button>
      <span id="gState" class="chip"></span>
    </div>
    <label for="gMsg">Message everyone sees during maintenance</label>
    <textarea id="gMsg" placeholder="We are upgrading the system. Please try again later."></textarea>
    <label for="gGrace">Hours a computer may work offline after a good check (0 = must be online)</label>
    <input id="gGrace" type="number" min="0" max="720" value="0">
    <div class="row" style="margin-top:12px"><button id="gSave">Save</button></div>
  </section>

  <section class="card">
    <h2>New client</h2>
    <label for="newName">Company name</label>
    <input id="newName" type="text" placeholder="e.g. Sunrise Builders" autocomplete="off">
    <label for="newMax">Computers allowed</label>
    <input id="newMax" type="number" min="1" max="10" value="1">
    <div class="row" style="margin-top:12px"><button id="create">Create license key</button></div>
    <div id="created" class="created hidden"></div>
  </section>

  <section>
    <h2 style="font-size:15px;margin:18px 2px 10px">Clients <span id="count" class="meta"></span></h2>
    <div id="list"></div>
  </section>
</main>
<div id="toast" class="toast hidden"></div>
<script type="module" src="./admin.js"></script>
</body>
</html>
