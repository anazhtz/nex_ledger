name: Build & Release NexLedger

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build Windows Executable
        run: flutter build windows --release

      - name: Compress Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nex_ledger-windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nex_ledger-windows-x64
          path: nex_ledger-windows-x64.zip

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests
        run: flutter test

      - name: Build macOS App
        run: flutter build macos --release --no-codesign

      - name: Compress macOS bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../nex_ledger-macos.zip nex_ledger.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nex_ledger-macos
          path: nex_ledger-macos.zip

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: nex_ledger-windows-x64

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: nex_ledger-macos

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            nex_ledger-windows-x64.zip
            nex_ledger-macos.zip
